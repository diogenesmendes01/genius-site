<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pesquisa de Clima — Equipe Genius</title>
  <meta name="description" content="Pesquisa anônima com a equipe da Genius Academia de Lenguas.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B1C3A">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/encuesta/encuesta.css">
</head>
<body data-survey="equipe"
      data-ui-forbidden="Este link não é válido. Peça à direção o link correto da pesquisa."
      data-ui-load-error="Não conseguimos carregar a pesquisa. Recarregue a página ou tente mais tarde.">

  <header class="hero">
    <p class="hero__brand">Genius · Academia de Lenguas</p>
    <h1 class="hero__title">Como está sendo trabalhar na Genius?</h1>
    <p class="hero__subtitle">Pesquisa anônima com toda a equipe. Leva uns 7 minutos. Você pode avançar e voltar sem perder as respostas.</p>
  </header>

  <main class="container">
    <div class="prog" id="progBar" aria-label="Progresso da pesquisa"></div>

    <div class="loading" id="loadingBox">Carregando pesquisa…</div>

    <div class="alert-error" id="stepAlert" role="alert"></div>

    <div id="stepHost"></div>

    <div class="s-nav hidden" id="navRow">
      <button type="button" class="btn btn--ghost" id="btnBack">← Voltar</button>
      <button type="button" class="btn btn--primary" id="btnNext">Continuar →</button>
    </div>

    <!-- Honeypot: invisível para pessoas, tentador para bots. -->
    <div class="hp-field" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <footer class="page-footer">
      © <span id="year"></span> Genius Idiomas · <a href="/">geniusidiomas.com</a>
    </footer>
  </main>

  <script src="/encuesta/app.js"></script>
</body>
</html>
